name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv venv --python 3.11 && uv pip install -e ".[dev]"
      - name: Test
        run: .venv/bin/python -m pytest -q
